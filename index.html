const pmrem = new THREE.PMREMGenerator(renderer);
const [hdr, heroG, wolfG, rockG, deadG, treeG, gD, gN, gR, mD, mN, mR] = await Promise.all([
  rgbeL.loadAsync('assets/hdri/meadow_2k.hdr'),
  gltfL.loadAsync('assets/models/heroine.vrm'),
  gltfL.loadAsync('assets/models/werewolf.glb'),
  gltfL.loadAsync('assets/models/boulder.glb'),
  gltfL.loadAsync('assets/models/deadtree.glb'),
  gltfL.loadAsync('assets/models/tree.glb'),
  texL.loadAsync('assets/textures/grass_diff.jpg'), texL.loadAsync('assets/textures/grass_nor_gl.jpg'), texL.loadAsync('assets/textures/grass_rough.jpg'),
  texL.loadAsync('assets/textures/metal_plate_diff.jpg'), texL.loadAsync('assets/textures/metal_plate_nor_gl.jpg'), texL.loadAsync('assets/textures/metal_plate_rough.jpg'),

// ---------------- terrain ----------------
for (const t of [gD, gN, gR]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(22, 22); t.anisotropy = 8; }

const groundGeo = new THREE.PlaneGeometry(160, 160, 200, 200); groundGeo.rotateX(-Math.PI / 2);

{ const p = groundGeo.attributes.position; for (let i = 0; i < p.count; i++) p.setY(i, groundH(p.getX(i), p.getZ(i))); groundGeo.computeVertexNormals(); }
const groundMat = new THREE.MeshStandardMaterial({ map: gD, normalMap: gN, roughnessMap: gR, normalScale: new THREE.Vector2(1.4, 1.4), color: 0xb4c48c });

    vec4 c1 = texture2D(map, vMapUv); vec4 c2 = texture2D(map, vMapUv * 0.23 + 0.37);
    float m = smoothstep(0.3, 0.7, sin(vMapUv.x*0.31)*cos(vMapUv.y*0.27)*0.5+0.5);
    vec4 sampledDiffuseColor = mix(c1, c2, 0.45 + 0.25*m);
    sampledDiffuseColor.rgb *= mix(vec3(0.82,0.95,0.62), vec3(0.95,1.0,0.7), m);
    sampledDiffuseColor.rgb = mix(sampledDiffuseColor.rgb, vec3(0.20,0.27,0.10), smoothstep(8.0, 45.0, length(vViewPosition)) * 0.7);

const ground = new THREE.Mesh(groundGeo, groundMat); ground.receiveShadow = true; scene.add(ground);

// grass: curved, tapered, wind-swayed instanced blades with root→tip gradient
const grassUniforms = { uTime: { value: 0 } };

  const p = g.attributes.position; for (let i = 0; i < p.count; i++) { const y = p.getY(i) / h; p.setX(i, p.getX(i) * (1 - y * 0.92)); p.setZ(i, y * y * h * 0.35); }

  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.75, side: THREE.DoubleSide });

    s.uniforms.uTime = grassUniforms.uTime;
    s.vertexShader = 'uniform float uTime; varying float vH;\n' + s.vertexShader.replace('#include <begin_vertex>', `
      vec3 transformed = vec3(position); vH = uv.y;
      vec4 wp = instanceMatrix * vec4(0.,0.,0.,1.);
      float sw = sin(uTime*1.7 + wp.x*0.6 + wp.z*0.4) * 0.5 + sin(uTime*3.1 + wp.x*1.7) * 0.18;
      transformed.x += sw * uv.y * uv.y * 0.09; transformed.z += sw * uv.y * uv.y * 0.05;`);

    const a = r() * Math.PI * 2, d = rMin + Math.sqrt(r()) * (rMax - rMin);
    const x = Math.cos(a) * d, z = Math.sin(a) * d - 1.5;
    pos.set(x, groundH(x, z) - 0.01, z);
    q.setFromEuler(new THREE.Euler((r() - .5) * .35, r() * 6.28, (r() - .5) * .35));

makeGrass(GRASS_N, 0.2, 13, 0.15, 0.03, 3);
makeGrass(LOW ? 3000 : 9000, 2.5, 16, 0.26, 0.04, 9);
// small wildflowers
{
  const fg = new THREE.IcosahedronGeometry(0.018, 0), fm = new THREE.MeshStandardMaterial({ roughness: 0.6 });
  const N = 1400, im = new THREE.InstancedMesh(fg, fm, N), m = new THREE.Matrix4(), c = new THREE.Color();
  for (let i = 0; i < N; i++) { const a = rnd() * 6.28, d = 2 + Math.sqrt(rnd()) * 12, x = Math.cos(a) * d, z = Math.sin(a) * d - 1.5;
    m.makeTranslation(x, groundH(x, z) + 0.12 + rnd() * 0.1, z); im.setMatrixAt(i, m);
    im.setColorAt(i, [c.set(0xfff6d8), c.set(0xf3d34a), c.set(0xb9a6ff), c.set(0xffffff)][i % 4].clone()); }
  scene.add(im);
}
// rocks, dead trunks, trees
function prep(o, cast = true) { o.traverse(m => { if (m.isMesh) { m.castShadow = cast; m.receiveShadow = true; } }); return o; }
const rockSpots = [[-4.2, -3.5, 0.55], [4.6, -4.4, 0.8], [-6.5, 1.5, 0.45], [6.8, 0.6, 0.6], [-2.6, -6.5, 0.9], [2.0, -8, 1.3], [-9, -6, 1.6], [9.5, -7, 1.8], [-3.1, 3.4, 0.22], [3.6, 2.8, 0.18], [0.6, -4.8, 0.3], [-5.4, -1.2, 0.25]];
for (const [x, z, s] of rockSpots) { const r = prep(rockG.scene.clone()); r.scale.setScalar(s); r.position.set(x, groundH(x, z) - s * 0.15, z); r.rotation.y = rnd() * 6.28; scene.add(r); }
for (const [x, z, s, ry] of [[-5.5, -5.0, 1.0, 0.4], [7.5, -3.2, 0.9, 2.2]]) { const d = prep(deadG.scene.clone()); d.scale.setScalar(s); d.position.set(x, groundH(x, z), z); d.rotation.y = ry; scene.add(d); }

for (const [x, z, s, ry] of [[-13, -16, 0.75, 0.3], [12, -19, 0.85, 1.9], [-24, -26, 0.9, 4.0], [22, -12, 0.7, 2.7], [2, -30, 1.0, 5.1]]) {
  const t = prep(treeG.scene.clone(), true); t.scale.setScalar(s); t.position.set(x, groundH(x, z) - 0.1, z); t.rotation.y = ry; scene.add(t); }

// ---------------- shared helpers ----------------
function remapTexture(tex, fn) {

// ---------------- metals ----------------

mD.colorSpace = THREE.SRGBColorSpace;
const MAT = {
  silver: new THREE.MeshPhysicalMaterial({ color: 0xd8dde6, metalness: 1, roughness: 0.32, roughnessMap: mR, normalMap: mN, normalScale: new THREE.Vector2(0.25, 0.25), clearcoat: 0.25, clearcoatRoughness: 0.2, envMapIntensity: 1.15 }),
  plate: new THREE.MeshPhysicalMaterial({ color: 0xc9cfd8, metalness: 1, roughness: 0.42, roughnessMap: mR, normalMap: mN, normalScale: new THREE.Vector2(0.3, 0.3), envMapIntensity: 1.0 }),

  dressDark: new THREE.MeshPhysicalMaterial({ color: 0x182c70, roughness: 0.7, sheen: 1, sheenRoughness: 0.5, sheenColor: new THREE.Color(0x5a76e0) }),

  heroRoot.position.copy(strikePos()); for (const e of [hpEl, lagEl]) e.style.transition = 'none'; setHP(50); sim(0.5);
  playTrack(SLASH); sim(0.47); flash = 0.9; hit = 0.8; burst(new V3(wolfRoot.position.x - 0.35, 1.35, wolfRoot.position.z + 0.1)); sim(0.05);
  render(); window.__ready = true;
} else if (DEMO === 'victory') {
  for (const e of [hpEl, lagEl]) e.style.transition = 'none'; sim(0.3); for (let i = 0; i < 4; i++) hitWolf(); dead = true; deathT = 0;
  winEl.style.transition = 'none'; winEl.classList.add('show'); heroState = 'victory'; track = null; sim(2.0); render(); window.__ready = true;
} else {
  window.__game = { swing, attack, reset, get hp() { return hp; } };
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => { step(Math.min(clock.getDelta(), 0.05)); render(); window.__ready = true; });
